name: Ejercicio Entregable - Pipeline de Datos Seguro

on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar Tests de Seguridad? (sí/no)"
        required: true
        type: choice
        options:
          - "sí"
          - "no"
        default: "no"

env:
  ARCHIVO_VENTAS: "ventas.json"

jobs:
  ci_seguridad:
    name: "CI & Seguridad"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Validar que ventas.json es un JSON válido
        run: |
          python3 -m json.tool $ARCHIVO_VENTAS > /dev/null
          echo "✅ $ARCHIVO_VENTAS es un JSON válido"

      - name: Escaneo de seguridad (claves API expuestas)
        if: ${{ inputs.tests_seguridad == 'sí' }}
        run: python3 scan_secrets.py $ARCHIVO_VENTAS

  procesamiento:
    name: "Procesamiento (${{ matrix.entorno }})"
    needs: ci_seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Generar reporte de ${{ matrix.entorno }}
        run: |
          echo "REPORTE DE VENTAS - ENTORNO: ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt
          echo "Fecha: $(date)" >> reporte_${{ matrix.entorno }}.txt
          echo "Registros procesados: $(python3 -c "import json; print(len(json.load(open('$ARCHIVO_VENTAS'))))")" >> reporte_${{ matrix.entorno }}.txt
          cat reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notificacion:
    name: "Notificación de éxito"
    needs: [ci_seguridad, procesamiento]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Simular envío a Discord
        run: |
          echo "🎉 Pipeline completado con éxito"
          echo "Enviando notificación a: ${{ secrets.DISCORD_WEBHOOK }}"